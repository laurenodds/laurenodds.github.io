<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Watch – Lauren Odds</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .youtube-playlists {
      max-width: 960px;
      margin: 3rem auto;
      padding: 1rem;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      gap: 2rem;
      align-items: center;
    }

    .youtube-playlists iframe {
      width: 100%;
      max-width: 640px;
      height: 360px;
      border-radius: 12px;
      border: none;
    }

    @media (max-width: 700px) {
      .youtube-playlists iframe {
        height: 220px;
      }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <nav class="navbar">
      <div class="logo">
        <a href="index.html">
          <img src="eye-closed-red.svg" alt="Lauren Odds Logo" style="height: 28px; vertical-align: middle; margin-right: 0.5rem;">
          Lauren Odds
        </a>
      </div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="listen.html">Listen</a></li>
        <li><a href="watch.html" class="active">Watch</a></li>
        <li><a href="epk.html">EPK</a></li>
      </ul>
    </nav>
  </header>

  <!-- MAIN CONTENT -->
  <main>
    <section class="youtube-playlists">
      <iframe src="https://www.youtube.com/embed/videoseries?si=ppMRyucozARb0AoL&amp;list=PLtrZZopfiENuB2tgF2c_341udVnGiog8g"
        title="YouTube Playlist 1" allowfullscreen
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin">
      </iframe>

      <iframe src="https://www.youtube.com/embed/videoseries?si=LVXU0gOZvdpZbNEl&amp;list=PLtrZZopfiENtajOHOjrDoLmAGUVujpj2h"
        title="YouTube Playlist 2" allowfullscreen
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin">
      </iframe>
    </section>
  </main>

  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="footer-content">
      <p><strong>Lauren Odds Music</strong></p>
      <p>laurenodds@gmail.com</p>
      <p>So-Called Victoria B.C., Canada</p>
      <p class="land-ack">
        Music written and performed on the unceded lands of the Lekwungan peoples, now known as the Songhees and Esquimalt First Nations.
      </p>
    </div>
  </footer>
